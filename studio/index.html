<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/icon-01.png">
  <title>PromptHQ Studio</title>
  <meta name="description" content="PromptHQ Studio : confiez-nous vos images et vidéos IA, on s'occupe de tout, de l'idée à la livraison.">
  <meta property="og:title" content="PromptHQ Studio">
  <meta property="og:image" content="https://prompthq.fr/og_image.jpeg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PromptHQ Studio">
  <meta name="twitter:image" content="https://prompthq.fr/og_image.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <script src="/analytics.js?v=1" defer></script>
  <style>
    /* Page d'attente : la vitrine du studio (maquette v3) n'est pas encore intégrée. */
    @font-face { font-family: 'StackSansText'; src: url('/StackSansText.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    :root { --bg: #000; --ink: #fff; --ink-2: rgba(255, 255, 255, 0.66); --studio-red: #D90606; color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: grid; place-items: center; padding: clamp(16px, 4vw, 48px); }
    main { display: flex; flex-direction: column; gap: 18px; max-width: 44ch; text-align: center; }
    .brand { font: 700 clamp(34px, 6vw, 64px)/1 'StackSansText', ui-monospace, Menlo, monospace; letter-spacing: -0.04em; margin: 0; }
    .brand small { display: block; margin-top: 10px; font: 600 clamp(11px, 1.2vw, 14px)/1 'StackSansText', ui-monospace, Menlo, monospace; letter-spacing: 0.36em; color: var(--studio-red); text-shadow: 0 0 18px rgba(217, 6, 6, 0.6); }
    p { margin: 0; color: var(--ink-2); font-size: 16px; line-height: 1.5; }
    a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); align-self: center; padding-bottom: 2px; }
    a:hover, a:focus-visible { border-color: var(--ink); outline: none; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">PromptHQ<small>STUDIO</small></h1>
    <p>Confiez-nous vos images et vidéos IA : on s'occupe de tout, de l'idée à la livraison. La vitrine du studio arrive bientôt.</p>
    <a href="/">← Retour à prompthq.fr</a>
  </main>
</body>
</html>
